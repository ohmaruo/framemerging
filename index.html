<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🐶 フレーム合成＆保存 🐶</title>
  <style>
    :root {
      --bg-color: #fff9fb;
      --card-bg: #ffffff;
      --accent-pink: #ff85a2;
      --soft-pink: #ffeef2;
      --text-color: #5a4e53;
      --border-color: #ffd6e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif;
      max-width: 500px;
      margin: 10px auto;
      padding: 0 10px;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(255, 182, 193, 0.2);
      border: 2px solid var(--border-color);
    }

    h1 { text-align: center; font-size: 1.3em; margin: 0 0 15px 0; color: var(--accent-pink); }
    .section { margin-bottom: 15px; background: #fff; border: 1.5px solid var(--border-color); border-radius: 14px; padding: 12px; }
    h3 { margin-top: 0; font-size: 0.9em; color: var(--accent-pink); }
    .sub-text { font-size: 0.75em; color: #948288; margin-top: -4px; margin-bottom: 8px; }

    .file-btn {
      background: var(--soft-pink); color: var(--accent-pink); border: 1.5px dashed var(--accent-pink);
      padding: 10px 16px; border-radius: 20px; cursor: pointer; display: inline-block; font-size: 0.85em; font-weight: bold;
      text-align: center; width: calc(100% - 32px);
    }

    .frame-slots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; justify-content: center; }
    .frame-slot {
      width: 60px; height: 60px; border: 2px dashed var(--border-color); border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; position: relative; background: var(--bg-color); overflow: hidden;
    }
    .frame-slot.active { border: 2.5px solid var(--accent-pink); background: var(--soft-pink); }
    .frame-slot img { width: 100%; height: 100%; object-fit: contain; }
    .frame-slot .slot-label { font-size: 0.65em; color: #b39aa2; text-align: center; }
    .frame-slot .remove-btn {
      position: absolute; top: 2px; right: 2px; background: #ff4d6d; color: white;
      border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer;
    }

    .preview-container { text-align: center; margin: 10px 0; padding: 8px; background: var(--bg-color); border-radius: 14px; border: 2px solid var(--border-color); }
    canvas { max-width: 100%; height: auto; border-radius: 10px; background: #fff; touch-action: none; }

    .control-group { margin: 8px 0; display: flex; align-items: center; gap: 6px; font-size: 0.8em; }
    label { min-width: 80px; font-weight: bold; }
    select { padding: 4px 8px; border-radius: 8px; border: 1.5px solid var(--border-color); background: white; font-size: 0.9em; }
    input[type="range"] { flex: 1; accent-color: var(--accent-pink); }

    .save-btn {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #fff; border: none;
      padding: 12px 16px; font-size: 0.95em; border-radius: 25px; cursor: pointer; width: 100%; font-weight: bold;
      box-shadow: 0 4px 12px rgba(255, 133, 162, 0.4); margin-top: 10px;
    }

    .clear-btn {
      background: #f0f0f0; color: #666; border: 1px solid #ccc;
      padding: 6px 12px; font-size: 0.75em; border-radius: 15px; cursor: pointer; margin-top: 10px; width: 100%;
    }

    /* 生成された画像表示エリア */
    .result-modal {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #fff;
      border: 2px solid var(--accent-pink);
      border-radius: 14px;
      text-align: center;
    }
    .result-modal img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .result-title {
      color: #ff4d6d;
      font-weight: bold;
      font-size: 0.9em;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🐶 フレーム合成＆保存 🐶</h1>

    <div class="section">
      <h3>🐶 1. フレーム素材（最大5個）</h3>
      <p class="sub-text">※端末の画像選択画面で画像を複数選んでください</p>
      
      <button type="button" class="file-btn" id="trigger-multi-upload">
        🐶 まとめてフレーム追加
      </button>
      <input type="file" id="upload-frame" accept="image/*" multiple style="display:none;">

      <div class="frame-slots" id="frame-slots"></div>
    </div>

    <div class="section">
      <h3>🐶 2. メイン画像をアップロード</h3>
      <input type="file" id="upload-image" accept="image/*" style="font-size:0.8em; width: 100%;">
    </div>

    <div class="preview-container">
      <p class="sub-text">👇 移動・ピンチ操作（または下で拡大倍率変更）</p>
      <canvas id="canvas" width="400" height="400"></canvas>
      <div class="control-group" style="margin-top: 10px;">
        <label style="min-width: 60px;">拡大倍率</label>
        <input type="range" id="zoom-range" min="0.2" max="3.0" step="0.05" value="1.0">
        <span id="zoom-val" style="min-width: 40px; font-weight: bold;">100%</span>
      </div>
    </div>

    <div class="section">
      <h3>🐶 3. サイズ・品質調整 ＆ 保存</h3>
      <div class="control-group">
        <label>長辺サイズ</label>
        <select id="size-option">
          <option value="1200">最大 1200px</option>
          <option value="800" selected>最大 800px</option>
          <option value="500">最大 500px</option>
        </select>
      </div>
      <div class="control-group">
        <label>画像品質</label>
        <input type="range" id="quality-range" min="0.1" max="1.0" step="0.05" value="0.85">
        <span id="quality-val">85%</span>
      </div>
      <div class="control-group">
        <label>保存形式</label>
        <select id="format-option">
          <option value="image/jpeg">JPEG (軽さ優先)</option>
          <option value="image/png">PNG (画質重視)</option>
        </select>
      </div>
    </div>

    <button class="save-btn" id="download-btn">🐶 画像を作成する</button>
    <button class="clear-btn" id="clear-storage-btn">🗑️ 保存データをリセットする</button>

    <!-- 生成結果エリア -->
    <div class="result-modal" id="result-modal">
      <div class="result-title">✨ 画像が完成しました！ ✨</div>
      <p class="sub-text">👇 下の画像を<b>長押し</b>して保存してください</p>
      <img id="result-img" src="" alt="合成画像">
    </div>
  </div>

  <input type="file" id="single-frame-input" accept="image/*" style="display:none;">

  <script>
    const STORAGE_KEY = 'frame_app_data_v1';

    const uploadImageInput = document.getElementById('upload-image');
    const uploadFrameInput = document.getElementById('upload-frame');
    const triggerMultiBtn = document.getElementById('trigger-multi-upload');
    const singleFrameInput = document.getElementById('single-frame-input');
    const frameSlotsContainer = document.getElementById('frame-slots');
    const downloadBtn = document.getElementById('download-btn');
    const clearStorageBtn = document.getElementById('clear-storage-btn');
    const qualityRange = document.getElementById('quality-range');
    const qualityVal = document.getElementById('quality-val');
    const zoomRange = document.getElementById('zoom-range');
    const zoomVal = document.getElementById('zoom-val');
    const sizeOption = document.getElementById('size-option');
    const formatOption = document.getElementById('format-option');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resultModal = document.getElementById('result-modal');
    const resultImg = document.getElementById('result-img');

    let baseImage = null;
    let baseImageDataUrl = null;
    let slots = Array(5).fill(null).map((_, i) => ({ id: i + 1, img: null, dataUrl: null, active: false }));
    let targetSlotIndex = null;
    let imgOffsetX = 0;
    let imgOffsetY = 0;
    let imgScale = 1.0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let touchDistance = null;

    // --- localStorage 保存＆復元ロジック ---
    function saveStateToStorage() {
      try {
        const state = {
          baseImageDataUrl,
          imgOffsetX,
          imgOffsetY,
          imgScale,
          sizeOption: sizeOption.value,
          qualityRange: qualityRange.value,
          formatOption: formatOption.value,
          slots: slots.map(s => ({
            id: s.id,
            dataUrl: s.dataUrl,
            active: s.active
          }))
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('localStorageの保存に失敗しました（容量制限の可能性があります）', e);
      }
    }

    async function loadStateFromStorage() {
      const dataStr = localStorage.getItem(STORAGE_KEY);
      if (!dataStr) {
        renderSlots();
        return;
      }

      try {
        const state = JSON.parse(dataStr);
        if (state.sizeOption) sizeOption.value = state.sizeOption;
        if (state.qualityRange) {
          qualityRange.value = state.qualityRange;
          qualityVal.textContent = Math.round(state.qualityRange * 100) + '%';
        }
        if (state.formatOption) formatOption.value = state.formatOption;

        imgOffsetX = state.imgOffsetX || 0;
        imgOffsetY = state.imgOffsetY || 0;
        imgScale = state.imgScale || 1.0;
        zoomRange.value = imgScale;
        zoomVal.textContent = Math.round(imgScale * 100) + '%';

        // メイン画像の復元
        if (state.baseImageDataUrl) {
          baseImageDataUrl = state.baseImageDataUrl;
          baseImage = await loadImageFromUrl(baseImageDataUrl);
        }

        // スロット（フレーム）の復元
        if (state.slots && Array.isArray(state.slots)) {
          for (let i = 0; i < state.slots.length; i++) {
            const savedSlot = state.slots[i];
            if (savedSlot && savedSlot.dataUrl) {
              const img = await loadImageFromUrl(savedSlot.dataUrl);
              slots[i] = {
                id: i + 1,
                img: img,
                dataUrl: savedSlot.dataUrl,
                active: savedSlot.active
              };
            }
          }
        }

        renderSlots();
        renderCanvas();
      } catch (e) {
        console.error('データの復元に失敗しました', e);
      }
    }

    function compressImageFile(file, maxDimension = 1200) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }
            const c = document.createElement('canvas');
            c.width = width;
            c.height = height;
            const cx = c.getContext('2d');
            cx.drawImage(img, 0, 0, width, height);
            const dataUrl = c.toDataURL('image/png');
            resolve({ img, dataUrl });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function loadImageFromUrl(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = url;
      });
    }

    // --- イベントリスナー設定 ---
    qualityRange.addEventListener('input', (e) => {
      qualityVal.textContent = Math.round(e.target.value * 100) + '%';
      saveStateToStorage();
    });

    sizeOption.addEventListener('change', saveStateToStorage);
    formatOption.addEventListener('change', saveStateToStorage);

    zoomRange.addEventListener('input', (e) => {
      imgScale = parseFloat(e.target.value);
      zoomVal.textContent = Math.round(imgScale * 100) + '%';
      renderCanvas();
      saveStateToStorage();
    });

    triggerMultiBtn.addEventListener('click', () => {
      uploadFrameInput.click();
    });

    const getPos = (e) => {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    };

    const getTouchDistance = (e) => {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    };

    const startDrag = (e) => {
      if (!baseImage) return;
      if (e.touches && e.touches.length === 2) {
        touchDistance = getTouchDistance(e);
        return;
      }
      isDragging = true;
      const pos = getPos(e);
      startX = pos.x - imgOffsetX;
      startY = pos.y - imgOffsetY;
    };

    const moveDrag = (e) => {
      if (!baseImage) return;
      if (e.touches && e.touches.length === 2) {
        const newDist = getTouchDistance(e);
        if (touchDistance) {
          const factor = newDist / touchDistance;
          imgScale = Math.min(Math.max(imgScale * factor, 0.2), 3.0);
          zoomRange.value = imgScale;
          zoomVal.textContent = Math.round(imgScale * 100) + '%';
          renderCanvas();
        }
        touchDistance = newDist;
        return;
      }

      if (!isDragging) return;
      const pos = getPos(e);
      imgOffsetX = pos.x - startX;
      imgOffsetY = pos.y - startY;
      renderCanvas();
    };

    const endDrag = () => { 
      if (isDragging || touchDistance) {
        saveStateToStorage();
      }
      isDragging = false; 
      touchDistance = null;
    };

    canvas.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', startDrag, { passive: true });
    window.addEventListener('touchmove', moveDrag, { passive: true });
    window.addEventListener('touchend', endDrag);

    canvas.addEventListener('wheel', (e) => {
      if (!baseImage) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.05 : 0.95;
      imgScale = Math.min(Math.max(imgScale * zoomFactor, 0.2), 3.0);
      zoomRange.value = imgScale;
      zoomVal.textContent = Math.round(imgScale * 100) + '%';
      renderCanvas();
      saveStateToStorage();
    }, { passive: false });

    uploadFrameInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      
      for (const file of files) {
        const emptySlot = slots.find(s => s.img === null);
        if (!emptySlot) break;

        const { img, dataUrl } = await compressImageFile(file, 1000);
        emptySlot.img = img;
        emptySlot.dataUrl = dataUrl;
        emptySlot.active = true;
      }

      renderSlots();
      renderCanvas();
      saveStateToStorage();
      uploadFrameInput.value = '';
    });

    singleFrameInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file && targetSlotIndex !== null) {
        const { img, dataUrl } = await compressImageFile(file, 1000);
        slots[targetSlotIndex].img = img;
        slots[targetSlotIndex].dataUrl = dataUrl;
        slots[targetSlotIndex].active = true;
        renderSlots();
        renderCanvas();
        saveStateToStorage();
      }
      singleFrameInput.value = '';
    });

    function renderSlots() {
      frameSlotsContainer.innerHTML = '';
      slots.forEach((slot, index) => {
        const div = document.createElement('div');
        div.className = `frame-slot ${slot.active ? 'active' : ''}`;
        
        if (slot.img) {
          const img = document.createElement('img');
          img.src = slot.img.src;
          div.appendChild(img);

          const removeBtn = document.createElement('button');
          removeBtn.className = 'remove-btn';
          removeBtn.innerHTML = '×';
          removeBtn.onclick = (e) => {
            e.stopPropagation();
            slots[index].img = null;
            slots[index].dataUrl = null;
            slots[index].active = false;
            renderSlots();
            renderCanvas();
            saveStateToStorage();
          };
          div.appendChild(removeBtn);

          div.onclick = () => {
            slots[index].active = !slots[index].active;
            renderSlots();
            renderCanvas();
            saveStateToStorage();
          };
        } else {
          div.innerHTML = `<span class="slot-label">枠 ${index + 1}<br>+追加</span>`;
          div.onclick = () => {
            targetSlotIndex = index;
            singleFrameInput.click();
          };
        }
        frameSlotsContainer.appendChild(div);
      });
    }

    uploadImageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const { img, dataUrl } = await compressImageFile(file, 1200);
      baseImage = img;
      baseImageDataUrl = dataUrl;
      imgOffsetX = 0;
      imgOffsetY = 0;
      imgScale = 1.0;
      zoomRange.value = 1.0;
      zoomVal.textContent = '100%';
      renderCanvas();
      saveStateToStorage();
    });

    function renderCanvas() {
      const activeFrames = slots.filter(s => s.img && s.active);

      if (activeFrames.length > 0) {
        canvas.width = activeFrames[0].img.width;
        canvas.height = activeFrames[0].img.height;
      } else if (baseImage) {
        canvas.width = baseImage.width;
        canvas.height = baseImage.height;
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (baseImage) {
        const baseAspectScale = canvas.height / baseImage.height;
        const drawWidth = baseImage.width * baseAspectScale * imgScale;
        const drawHeight = canvas.height * imgScale;
        
        const drawX = (canvas.width - drawWidth) / 2 + imgOffsetX;
        const drawY = (canvas.height - drawHeight) / 2 + imgOffsetY;
        
        ctx.drawImage(baseImage, drawX, drawY, drawWidth, drawHeight);
      }

      activeFrames.forEach(slot => {
        ctx.drawImage(slot.img, 0, 0, canvas.width, canvas.height);
      });
    }

    downloadBtn.addEventListener('click', () => {
      if (!baseImage) {
        alert('メイン画像をアップロードしてください。');
        return;
      }

      const exportCanvas = document.createElement('canvas');
      const exportCtx = exportCanvas.getContext('2d');

      let targetWidth = canvas.width;
      let targetHeight = canvas.height;
      const maxDimension = sizeOption.value;

      if (maxDimension !== 'original') {
        const max = parseInt(maxDimension, 10);
        if (targetWidth > max || targetHeight > max) {
          if (targetWidth > targetHeight) {
            targetHeight = Math.round((targetHeight * max) / targetWidth);
            targetWidth = max;
          } else {
            targetWidth = Math.round((targetWidth * max) / targetHeight);
            targetHeight = max;
          }
        }
      }

      exportCanvas.width = targetWidth;
      exportCanvas.height = targetHeight;
      exportCtx.drawImage(canvas, 0, 0, targetWidth, targetHeight);

      const format = formatOption.value;
      const quality = parseFloat(qualityRange.value);
      
      try {
        const dataUrl = exportCanvas.toDataURL(format, quality);
        
        resultImg.src = dataUrl;
        resultModal.style.display = 'block';
        resultModal.scrollIntoView({ behavior: 'smooth' });

        const link = document.createElement('a');
        link.download = `framed_image.${format === 'image/jpeg' ? 'jpg' : 'png'}`;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (e) {
        alert('画像生成に失敗しました。');
      }
    });

    clearStorageBtn.addEventListener('click', () => {
      if (confirm('保存されている画像や設定をすべてクリアしますか？')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    });

    // 初期化（保存データの読み込み）
    loadStateFromStorage();
  </script>
</body>
</html>
